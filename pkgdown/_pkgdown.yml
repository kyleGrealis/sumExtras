url: https://www.kyleGrealis.com/sumExtras/

development:
  mode: auto

repo:
  url:
    home: https://github.com/kyleGrealis/sumExtras/
    source: https://github.com/kyleGrealis/sumExtras/blob/HEAD/
    issue: https://github.com/kyleGrealis/sumExtras/issues/
    user: https://github.com/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    font-size: 0.9rem
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  sidebar:
    structure:
      - links
      - license
      - community
      - citation
      - authors
      - badges
      - dev
    components:
      badges:
        title: ~
        text: |
          [![R-CMD-check](https://github.com/kyleGrealis/sumExtras/actions/workflows/R-CMD-check.yaml/badge.svg)](https://github.com/kyleGrealis/sumExtras/actions/workflows/R-CMD-check.yaml)

          [![Lifecycle: stable](https://img.shields.io/badge/lifecycle-stable-brightgreen.svg)](https://lifecycle.r-lib.org/articles/stages.html#stable)

          [![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](https://opensource.org/licenses/MIT)

          [![CRAN status](https://www.r-pkg.org/badges/version/sumExtras)](https://CRAN.R-project.org/package=sumExtras)

          [![CRAN downloads](https://cranlogs.r-pkg.org/badges/sumExtras)](https://cran.r-project.org/package=sumExtras)

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/sumExtras-intro.html
    articles:
      text: Articles
      menu:
        - text: Automatic Variable Labeling
          href: articles/labeling.html
        - text: Table Styling and Formatting
          href: articles/styling.html
        - text: Themes
          href: articles/themes.html
        - text: Package Options
          href: articles/options.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/kyleGrealis/sumExtras
      aria-label: GitHub

articles:
  - title: Get Started
    navbar: ~
    contents:
      - sumExtras-intro
      - labeling
      - styling
      - themes
      - options

reference:
  - title: "Core Table Styling"
    desc: "Main functions for adding professional formatting to gtsummary tables"
    contents:
      - extras
      - clean_table
  - title: "Automatic Variable Labeling"
    desc: "Functions for managing variable labels from data dictionaries"
    contents:
      - add_auto_labels
  - title: "Theme Functions"
    desc: "Apply JAMA-style compact themes for consistent professional formatting"
    contents:
      - use_jama_theme
      - theme_gt_compact
  - title: "Group Header Styling"
    desc: "Enhanced formatting for variable group headers in summary tables"
    contents:
      - add_group_styling
      - add_group_colors
      - get_group_rows

footer:
  structure:
    left: developed_by
    right: built_with

authors:
  Kyle Grealis:
    href: https://www.kylegrealis.com
  sidebar:
    roles: [aut, cre]
