url: https://www.kyleGrealis.com/sumExtras/

development:
  mode: auto

repo:
  url:
    home: https://github.com/kyleGrealis/sumExtras/
    source: https://github.com/kyleGrealis/sumExtras/blob/HEAD/
    issue: https://github.com/kyleGrealis/sumExtras/issues/
    user: https://github.com/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    font-size: 0.9rem
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/sumExtras-intro.html
    articles:
      text: Articles
      menu:
        - text: Automatic Variable Labeling
          href: articles/labeling.html
        - text: Table Styling and Formatting
          href: articles/styling.html
        - text: Themes
          href: articles/themes.html
        - text: Package Options
          href: articles/options.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/kyleGrealis/sumExtras
      aria-label: GitHub

articles:
  - title: Get Started
    navbar: ~
    contents:
      - sumExtras-intro
      - labeling
      - styling
      - themes
      - options

reference:
  - title: "Core Table Styling"
    desc: "Main functions for adding professional formatting to gtsummary tables"
    contents:
      - extras
      - clean_table
  - title: "Automatic Variable Labeling"
    desc: "Functions for managing variable labels from data dictionaries"
    contents:
      - add_auto_labels
  - title: "Theme Functions"
    desc: "Apply JAMA-style compact themes for consistent professional formatting"
    contents:
      - use_jama_theme
      - theme_gt_compact
  - title: "Group Header Styling"
    desc: "Enhanced formatting for variable group headers in summary tables"
    contents:
      - add_group_styling
      - add_group_colors
      - get_group_rows

footer:
  structure:
    left: developed_by
    right: built_with

authors:
  Kyle Grealis:
    href: https://www.kylegrealis.com
  sidebar:
    roles: [aut, cre]
